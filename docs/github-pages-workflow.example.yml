# 可選：若要「push main 就自動更新 Pages」，把這份複製到
#   .github/workflows/pages.yml
# （需在 GitHub 網頁新增／或 token 有 workflow scope）
#
# 目前正式流程是手動：scripts/deploy-pages.ps1 → gh-pages 分支
# 請勿使用「Upload entire repository」那種範本，會把整包原始碼當網站。

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Astro (Pages base /GoLearning/)
        working-directory: web
        env:
          GITHUB_PAGES: "true"
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
