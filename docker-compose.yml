# Production stack
#
#   docker compose up --build -d
#
#   ★ 教學網站 + 線上 Playground : http://localhost:8088
#   ★ Arena Mini 遊戲 only       : http://localhost:8080
#
# Ports (optional .env):
#   WEB_PORT=8088
#   ARENA_PORT=8080

services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: golearning-web:latest
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      - runner
    networks:
      - default
      - internal
    restart: unless-stopped

  runner:
    build:
      context: .
      dockerfile: services/runner/Dockerfile
    image: golearning-runner:latest
    environment:
      ADDR: ":8091"
    # Not published — only nginx /api/run on web
    mem_limit: 512m
    cpus: 1.0
    networks:
      - internal
    restart: unless-stopped

  arena:
    build:
      context: .
      dockerfile: demo/arena-mini/Dockerfile
    image: golearning-arena:latest
    environment:
      ADDR: ":8080"
      WEB_DIR: "/web"
    ports:
      - "${ARENA_PORT:-8080}:8080"
    networks:
      - default
    restart: unless-stopped

networks:
  default:
  # No outbound internet for runner (stdlib-only playground)
  internal:
    internal: true
