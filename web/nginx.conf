server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Critical when published as host:8088→container:80:
    # default absolute redirects become http://host/path/ (port 80) and break navigation.
    absolute_redirect off;
    port_in_redirect on;

    # Astro static output: /path/index.html
    # Prefer directory + trailing slash so internal links resolve.
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # JSON search index
    location = /search-index.json {
        default_type application/json;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
