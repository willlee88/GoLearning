# Development compose: bind-mount source, hot reload (needs repo on disk).
#   docker compose -f docker-compose.dev.yml up
#   docker compose -f docker-compose.dev.yml --profile demo up

services:
  web:
    image: node:22-bookworm
    working_dir: /app/web
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 4321"
    ports:
      - "4321:4321"

  arena:
    image: golang:1.22-bookworm
    working_dir: /app/demo/arena-mini/server
    volumes:
      - ./:/app
    environment:
      ADDR: ":8080"
      WEB_DIR: "/app/demo/arena-mini/web"
    command: sh -c "go mod tidy && go run ./cmd/server"
    ports:
      - "8080:8080"
    profiles:
      - demo
